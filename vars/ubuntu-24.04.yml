_service: apache2.service

_apt_key:
  - url: http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x15058500A0235D97F5D10063B188E2B695BD4743
    dest: /etc/apt/keyrings/sury.asc
    checksum: "sha256:023b08fdf09fcf0a123ebef0b247765bad2481327bbdee3599bf7bbae3ae2061"

_deb822_repository:
  - name: sury-apache2
    types: deb
    uris: http://packages.sury.org/apache2
    suites: noble
    components: main
    signed_by: /etc/apt/keyrings/sury.asc
    enabled: true
    state: present

_apt:
  - { state: latest, name: ssl-cert }
  - { state: latest, name: apache2 }
  - { state: latest, name: apache2-bin }
  - { state: latest, name: apache2-data }
  - { state: latest, name: apache2-doc }
  - { state: latest, name: apache2-utils }
